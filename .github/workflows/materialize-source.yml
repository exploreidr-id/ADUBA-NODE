name: materialize compressed Go sources

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Go source files
        run: |
          gzip -dc node/main.go.gz > node/main.go
          gzip -dc node/main_test.go.gz > node/main_test.go
          rm node/main.go.gz node/main_test.go.gz
      - name: Commit restored sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add node/main.go node/main_test.go node/main.go.gz node/main_test.go.gz
          git diff --cached --quiet && exit 0
          git commit -m "chore: materialize Go sources"
          git push
